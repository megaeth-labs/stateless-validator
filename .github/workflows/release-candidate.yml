name: Release Candidate

# Trunk-first release start. Dispatch with a version: the shared action bumps
# the version file on the default branch, drafts the changelog entry, and
# opens a candidate PR. When that
# PR merges, the `cut` job creates `release-vX.Y.Z` at the merge commit. No
# tag is created here — see release-settle / release-publish.
#
# To release a commit that is not the tip of the default branch, dispatch with
# `base_commit` as well: `propose` creates `release-vX.Y.Z` at that commit and
# aims the candidate PR at it, so that PR never touches the default branch and
# the `cut` job below does not run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true
        type: string
      base_commit:
        description: "Commit to release (blank: the tip of the default branch)"
        required: false
        type: string
        default: ""
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch'
    # One proposal at a time: two dispatches would race on the candidate
    # branch. Job-level, not workflow-level: every PR closing on the default
    # branch also starts this workflow, and a workflow-wide group would let
    # that noise evict a queued release run (one pending run per group).
    # A skipped job holds no slot in a job-level group.
    concurrency:
      group: ${{ github.workflow }}-propose
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.MEGA_MAXWELL_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_MAXWELL_PK }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: megaeth-labs/.github/.github/actions/release-candidate@main
        with:
          stage: propose
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ inputs.version }}
          base_commit: ${{ inputs.base_commit }}
          version_file: Cargo.toml
          version_pattern: toml
          changelog_file: CHANGELOG.md
          # Cargo.lock carries the workspace crate versions too.
          bump_command: cargo update --workspace

  cut:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-candidate-') &&
      github.event.pull_request.user.login == 'mega-maxwell[bot]'
    # One cut at a time, never cancelled: pull_request.closed does not refire.
    # Job-level for the reason given on `propose`.
    concurrency:
      group: ${{ github.workflow }}-cut
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.MEGA_MAXWELL_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_MAXWELL_PK }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-candidate@main
        with:
          stage: cut
          token: ${{ steps.app-token.outputs.token }}
          version_file: Cargo.toml
          version_pattern: toml
