name: Release Candidate

# Trunk-first release start. Dispatch with a version: the shared action bumps
# the version file on the default branch, drafts the changelog entry, and
# opens a candidate PR. When that PR merges, the push to the default branch
# starts this workflow again: `route` recognises the merged candidate PR and
# `cut` creates `release-vX.Y.Z` at the merge commit. No tag is created here;
# see release-settle.
#
# To release a commit that is not the tip of the default branch, dispatch with
# `base_commit` as well: `propose` creates `release-vX.Y.Z` at that commit and
# aims the candidate PR at it, so that PR never touches the default branch and
# `route` never selects `cut` for it.
#
# Every write is made by the release GitHub App (mega-gutenberg). Store
# MEGA_GUTENBERG_CLIENT_ID as an organization variable and MEGA_GUTENBERG_PK
# as an organization secret with access granted to this repository.
# Branch and PR jobs need no environment; tagging and
# publishing are review-gated in release-settle. `route` is read-only and uses
# the job token.
#
# Guide: https://github.com/megaeth-labs/.github/blob/main/.github/actions/RELEASE.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true
        type: string
      base_commit:
        description: "Commit to release (blank: the tip of the default branch)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch'
    # One proposal at a time: two dispatches would race on the candidate
    # branch. Job-level, not workflow-level: every push to the default branch
    # also starts this workflow, and a workflow-wide group would let that
    # noise evict a queued release run (one pending run per group).
    # A skipped job holds no slot in a job-level group.
    concurrency:
      group: ${{ github.workflow }}-propose
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.MEGA_GUTENBERG_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_GUTENBERG_PK }}
          owner: megaeth-labs
          repositories: stateless-validator
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The bump command runs cargo.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: megaeth-labs/.github/.github/actions/release-candidate@main
        with:
          stage: propose
          token: ${{ steps.release-token.outputs.token }}
          version: ${{ inputs.version }}
          base_commit: ${{ inputs.base_commit }}
          version_file: Cargo.toml
          version_pattern: toml
          changelog_file: CHANGELOG.md
          # Cargo.lock carries the workspace crate versions too.
          bump_command: cargo update --workspace
          # Every Git dependency in Cargo.lock is public (see
          # .github/ci-credentials.md), so the read-only job token is enough;
          # it never sees the release token.
          dependency_token: ${{ github.token }}

  # Only trunk candidates follow trunk pushes; base_commit candidates belong
  # to their release branch and must never pick up changes from trunk.
  refresh-candidates:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.candidates.outputs.prs }}
    steps:
      - id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prs="$(gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base="$DEFAULT_BRANCH" -f per_page=100 \
            --jq '[.[][] | select(.head.ref | startswith("chore/release-candidate-")) | select(.head.repo.full_name == .base.repo.full_name) | .number]')"
          echo "prs=$(jq -c . <<< "$prs")" >> "$GITHUB_OUTPUT"

  refresh:
    needs: refresh-candidates
    if: needs.refresh-candidates.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.refresh-candidates.outputs.prs) }}
    concurrency:
      group: ${{ github.workflow }}-refresh-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Recheck after queueing: a candidate may have closed or changed base
      # while another refresh held its concurrency slot.
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'select(.state == "open") | select(.base.ref == env.DEFAULT_BRANCH) | select(.head.repo.full_name == .base.repo.full_name) | .head.ref | select(startswith("chore/release-candidate-")) | ltrimstr("chore/release-candidate-")')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.candidate.outputs.version != ''
        id: release-token
        with:
          client-id: ${{ vars.MEGA_GUTENBERG_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_GUTENBERG_PK }}
          owner: megaeth-labs
          repositories: stateless-validator
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.candidate.outputs.version != ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-candidate@main
        if: steps.candidate.outputs.version != ''
        with:
          stage: refresh
          token: ${{ steps.release-token.outputs.token }}
          version: ${{ steps.candidate.outputs.version }}
          pr_number: ${{ matrix.pr }}
          version_file: Cargo.toml
          version_pattern: toml
          changelog_file: CHANGELOG.md

  # Read-only: decides from the pushed commit whether it is a merged candidate
  # PR that targeted the default branch. One proposed with `base_commit` merges
  # into the release branch propose already cut, and routes to nothing here.
  route:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.route.outputs.action }}
      commit: ${{ steps.route.outputs.commit }}
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: route
        uses: megaeth-labs/.github/.github/actions/release-route@main
        with:
          kind: candidate
          version_file: Cargo.toml
          version_pattern: toml

  cut:
    needs: route
    if: needs.route.outputs.action == 'cut'
    # One cut at a time, never cancelled: a push does not refire.
    # Job-level for the reason given on `propose`.
    concurrency:
      group: ${{ github.workflow }}-cut
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.MEGA_GUTENBERG_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_GUTENBERG_PK }}
          owner: megaeth-labs
          repositories: stateless-validator
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-candidate@main
        with:
          stage: cut
          token: ${{ steps.release-token.outputs.token }}
          commit: ${{ needs.route.outputs.commit }}
          pr_number: ${{ needs.route.outputs.pr_number }}
          version_file: Cargo.toml
          version_pattern: toml
