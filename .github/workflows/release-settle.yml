name: Release Settle

# Settle a release candidate by pull request. A push to a `release-v*` branch
# starts this workflow and `route` decides what the push means:
#   refresh  the candidate has landed on the release branch: generate release
#            notes from the commits since the previous tag and open or update
#            a reviewed `chore/release-settle-vX.Y.Z` PR onto the release
#            branch with the changelog entry;
#   publish  that settle PR was just merged: create the annotated tag at the
#            merge commit and the GitHub Release with the changelog section
#            as notes.
# Merging the settle PR is the release decision on a push. Dispatch with
# `version` to publish a clean release branch (no settle PR needed), or to
# refresh it when settlement is needed; a blank version refreshes every
# eligible release branch.
#
# Every write is made by the release GitHub App (mega-gutenberg), which reads
# MEGA_GUTENBERG_CLIENT_ID and MEGA_GUTENBERG_PK from organization scope, so
# the PR-creating jobs declare no environment. Only the publish job waits on
# the `release` environment, whose required reviewers authorise the tag and the
# GitHub Release. The app is a bypass actor on the `v*` tag ruleset only; the
# `release-*` branch ruleset still requires the reviewed settle PR. `route` is
# read-only and uses the job token.
#
# The settle PR carries no labels: the `compat:*` label required by the
# Compatibility Label Check is a per-release judgement, so the reviewer adds
# it, and the check re-runs on `labeled`.
#
# This file must exist on the release branch (it does, when the branch is cut
# from `main`); a push to the branch runs the copy of the workflow on that
# branch.
#
# Guide: https://github.com/megaeth-labs/.github/blob/main/.github/actions/RELEASE.md

on:
  push:
    branches: ["release-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to refresh (X.Y.Z); blank: every eligible release branch"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Read-only: classifies the push (or the dispatch) as refresh, publish or skip.
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.route.outputs.action }}
      settle_source: ${{ steps.route.outputs.settle_source }}
      targets: ${{ steps.route.outputs.targets }}
      release_branch: ${{ steps.route.outputs.release_branch }}
      commit: ${{ steps.route.outputs.commit }}
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: route
        uses: megaeth-labs/.github/.github/actions/release-route@main
        with:
          kind: settle
          version: ${{ inputs.version }}
          version_file: Cargo.toml
          version_pattern: toml

  refresh:
    needs: route
    if: needs.route.outputs.action == 'refresh'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.route.outputs.targets) }}
    # One refresh per release branch, queued and never cancelled: two runs
    # would race on the settle PR branch.
    concurrency:
      group: release-settle-refresh-${{ matrix.target.release_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.MEGA_GUTENBERG_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_GUTENBERG_PK }}
          owner: megaeth-labs
          repositories: stateless-validator
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-settle@main
        with:
          token: ${{ steps.release-token.outputs.token }}
          version: ${{ matrix.target.version }}
          commit: ${{ matrix.target.commit }}
          release_branch: ${{ matrix.target.release_branch }}
          version_file: Cargo.toml
          version_pattern: toml
          changelog_file: CHANGELOG.md

  publish:
    needs: route
    if: needs.route.outputs.action == 'publish'
    # One publish per release branch: the tag guard and the tag push are two
    # steps, so a re-run must queue behind a run in flight, never overlap it.
    concurrency:
      group: release-settle-publish-${{ needs.route.outputs.release_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.MEGA_GUTENBERG_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_GUTENBERG_PK }}
          owner: megaeth-labs
          repositories: stateless-validator
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-publish@main
        with:
          token: ${{ steps.release-token.outputs.token }}
          commit: ${{ needs.route.outputs.commit }}
          pr_number: ${{ needs.route.outputs.pr_number }}
          settle_source: ${{ needs.route.outputs.settle_source || 'pr' }}
          release_branch: ${{ needs.route.outputs.release_branch }}
          version_file: Cargo.toml
          version_pattern: toml
          changelog_file: CHANGELOG.md
