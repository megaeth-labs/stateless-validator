name: On Release

# Publish target for a stateless-validator release: the two binaries, taken
# from the GitHub Release, to the MegaETH Artifact Registry. Runs when the
# release pipeline publishes the Release, and on demand for a rehearsal on a
# tag ref:
#   gh workflow run on-release.yml --ref vX.Y.Z -f dry_run=true
# The tag being released is always the run's own ref; there is no tag input.
#
# Nothing is built here. release-settle builds the binaries and publishes the
# Release with them and a SHA256SUMS file already attached (a published Release
# is immutable, so nothing can be attached from this workflow), and the
# registry gets those same bytes. The Release also outlives any wait for the
# reviewer, unlike a workflow artifact with a short retention. A rehearsal
# therefore needs a tag whose Release carries these files.
#
# This file must exist on the release branch: a `release` event resolves the
# workflow from the tagged commit's tree, not from the default branch, and the
# tag sits on the release branch. A branch cut from a default branch that has
# this file carries it; a branch cut before it landed needs it cherry-picked
# (via its own PR — the `release-*` ruleset requires one) before release-settle
# is dispatched, or the registry upload is skipped with no failed run;
# release-settle warns when the tip lacks a workflow main has.
# A rehearsal likewise only works on a tag whose tree has this file.
#
# Target:
#   registry — both binaries to the MegaETH Artifact Registry (generic repo
#              megaeth-generic-registry), replacing the former release.yaml /
#              release-tracing.yaml. The layout is the one deployment reads:
#              release-info pins <artifact>/<commit>/<profile>/<version> and
#              the Ansible role downloads exactly that path, so the package
#              version is the commit SHA and the file sits under
#              release/vX.Y.Z/ — <binary>/<sha>/release/vX.Y.Z/<binary>.
#
# GCP_AUTH_KEY lives in the `release` environment, which admits main,
# release-v* branches and v* tags with required reviewer approval.
# The registry job reads it when publishing artifacts for a release tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Download and checksum the Release binaries; upload nothing"
        required: false
        type: boolean
        default: true

# One run per tag: a release run and a dispatch on the same tag upload to the
# same registry paths, so overlapping runs would race.
# Never cancel an upload mid-flight; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  # A release event is never a dry run; a dispatch defaults to one.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Require a tag ref
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::this workflow publishes the run's own ref, which must be a tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME); dispatch it with --ref vX.Y.Z"; exit 1; }

      - name: Download the Release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir target/release \
            --pattern stateless-validator --pattern debug-trace-server --pattern SHA256SUMS
          cd target/release
          sha256sum --check --strict SHA256SUMS

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_AUTH_KEY }}

      - uses: megaeth-labs/.github/.github/actions/release-upload-artifact@main
        id: validator
        with:
          file: target/release/stateless-validator
          kind: artifact-registry
          project: devops-production-464602
          location: asia-northeast1
          repository: megaeth-generic-registry
          package: stateless-validator
          version: ${{ github.sha }}
          path: release/${{ env.TAG }}
          dry_run: ${{ env.DRY_RUN }}

      - uses: megaeth-labs/.github/.github/actions/release-upload-artifact@main
        id: dts
        with:
          file: target/release/debug-trace-server
          kind: artifact-registry
          project: devops-production-464602
          location: asia-northeast1
          repository: megaeth-generic-registry
          package: debug-trace-server
          version: ${{ github.sha }}
          path: release/${{ env.TAG }}
          dry_run: ${{ env.DRY_RUN }}

      - run: |
          echo "stateless-validator ${{ env.TAG }}: registry=${{ steps.validator.outputs.status }} ${{ steps.validator.outputs.uri }} sha256=${{ steps.validator.outputs.sha256 }}"
          echo "debug-trace-server  ${{ env.TAG }}: registry=${{ steps.dts.outputs.status }} ${{ steps.dts.outputs.uri }} sha256=${{ steps.dts.outputs.sha256 }}"
