[workspace]
members = [
    "bin/debug-trace-server",
    "bin/stateless-validator",
    "crates/stateless-common",
    "crates/stateless-core",
    "crates/stateless-db",
    "crates/stateless-r2",
    "crates/stateless-test-utils",
]
resolver = "2"

[workspace.package]
version = "2.0.16"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/megaeth-labs/stateless-validator"
exclude = [".github/"]

[workspace.dependencies]
# alloy
alloy-consensus = { version = "2.0.5", default-features = false }
alloy-eips = { version = "2.0.5", default-features = false }
alloy-evm = { version = "0.36.0", default-features = false }
alloy-genesis = { version = "2.0.5", default-features = false }
alloy-hardforks = { version = "0.4.7", default-features = false }
alloy-network = "2.0.5"
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false }
alloy-provider = { version = "2.0.5", features = [
    "reqwest",
    "reqwest-rustls-tls",
], default-features = false }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-rpc-types-eth = { version = "2.0.5", default-features = false }
alloy-rpc-types-trace = "2.0.5"
alloy-serde = { version = "2.0.5", default-features = false }
alloy-signer-local = "2.0.5"
alloy-trie = { version = "0.9.4", default-features = false }

# mega
mega-evm = { git = "https://github.com/megaeth-labs/mega-evm.git", branch = "cz/chore/upgrade-revm-40", default-features = false }
salt = { git = "https://github.com/megaeth-labs/salt.git", tag = "v1.0.5", default-features = false }

# op
# The OP crates are pinned to the same Optimism monorepo revision as mega-evm's
# cz/chore/upgrade-revm-40 branch: crates.io has no op-revm / alloy-op-evm release built
# against revm 40, and every OP crate must share one source identity for OpTxEnvelope,
# receipt, and hardfork types. reth-optimism-chainspec also lives in that monorepo now.
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }
op-alloy-network = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }
op-alloy-rpc-types = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }

# reth
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-optimism-chainspec = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }

# revm
revm = { version = "40.0.3", default-features = false }
revm-inspectors = { version = "0.40.1", features = ["std", "js-tracer"], default-features = false }

# misc
auto_impl = { version = "1.3", default-features = false }
base64 = { version = "0.22", default-features = false }
bincode = { version = "2.0", features = ["serde", "alloc"], default-features = false }
bytes = "1.11"
chrono = { version = "0.4", default-features = false }
clap = { version = "4.6", features = ["derive", "env", "std"], default-features = false }
dashmap = { version = "6.1", default-features = false }
dotenvy = "0.15"
dyn-clone = "1.0"
eyre = { version = "0.6", features = ["auto-install"], default-features = false }
fastrand = { version = "2.4", default-features = false }
flate2 = { version = "1.1", features = ["rust_backend"], default-features = false }
futures = { version = "0.3", default-features = false }
hashbrown = { version = "0.16", default-features = false }
hex = { version = "0.4", default-features = false }
hmac = { version = "0.12", default-features = false }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"], default-features = false }
jsonrpsee-types = "0.26"
kanal = { version = "0.1", features = ["async"], default-features = false }
libc = { version = "0.2", default-features = false }
lz4_flex = { version = "0.13", default-features = false }
metrics = "0.24"
metrics-derive = "0.1"
metrics-exporter-prometheus = { version = "0.18", features = ["http-listener"], default-features = false }
num_cpus = "1.17"
percent-encoding = { version = "2.3", default-features = false }
pin-project-lite = "0.2"
quick_cache = { version = "0.6", default-features = false }
rayon = "1.11"
redb = "4.0"
reqwest = { version = "0.12", default-features = false }
rolling-file = "0.2"
rustc-hash = { version = "2.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
smallvec = { version = "1.15", features = ["const_new"], default-features = false }
tempfile = { version = "3.27", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.51", features = ["rt-multi-thread", "signal"], default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd"], default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-appender = "0.2"
tracing-subscriber = { version = "=0.3.23", features = ["ansi", "env-filter", "fmt", "json"], default-features = false }
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false

[profile.test]
opt-level = 3
debug-assertions = true
incremental = true
debug = true
