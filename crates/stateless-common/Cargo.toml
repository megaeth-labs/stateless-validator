[package]
name = "stateless-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-trie.workspace = true

# mega
salt.workspace = true

# op
op-alloy-network.workspace = true
op-alloy-rpc-types.workspace = true

# revm
revm.workspace = true

# stateless
stateless-core = { path = "../stateless-core" }
stateless-r2 = { path = "../stateless-r2" }

# misc
base64.workspace = true
bincode.workspace = true
clap.workspace = true
eyre.workspace = true
futures.workspace = true
metrics-exporter-prometheus.workspace = true
# Also enables gzip/brotli on the shared reqwest 0.12 client (Cargo feature unification) for witness/data fetches.
reqwest = { workspace = true, features = ["gzip", "brotli"] }
rolling-file.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
jsonrpsee.workspace = true
kanal.workspace = true
stateless-test-utils = { path = "../stateless-test-utils", features = ["mock-rpc"] }
tokio-util.workspace = true

[[bench]]
harness = false
name = "witness_zstd_level"
